server:
  port: 8080
  servlet:
    context-path: /socia/v1

spring:
  application:
    name: socia
  datasource:
    url: jdbc:mysql://localhost:3306/socia?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # HS512 requires a secret of at least 64 bytes. Set JWT_SECRET outside local development.
    secret: ${JWT_SECRET:change-this-development-secret-to-a-secure-value-with-at-least-64-bytes}
    issuer: ${JWT_ISSUER:socia}
