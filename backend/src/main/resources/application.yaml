server:
  port: 8080
  servlet:
    context-path: /socia/v1

spring:
  application:
    name: socia
  datasource:
    url: jdbc:mysql://localhost:3306/socia?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
